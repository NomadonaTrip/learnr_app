# Bugs discovered and fixed during QA review
bugs_found_and_fixed:
  - id: BUG-4.9-001
    severity: Medium
    category: Performance
    summary: "N+1 query pattern in review summary generation"
    description: "_get_still_incorrect_concepts() made separate database queries for each incorrect response, causing performance degradation"
    root_cause: "Missing batch loading for questions with concepts"
    fix: "Added get_questions_with_concepts_batch() repository method with eager loading via selectinload"
    refs:
      - "apps/api/src/services/review_session_service.py:576-633"
      - "apps/api/src/repositories/review_session_repository.py:271-306"
    status: FIXED
    verified: true

  - id: BUG-4.9-002
    severity: High
    category: Navigation
    summary: "Study concept links pointed to non-existent route"
    description: "After submitting wrong answer in review, 'Study this concept' button caused 404 error"
    root_cause: "reading_link generated as /reading/library?concept=... but frontend route is /reading-library"
    fix: "Changed URL pattern to /reading-library?concept=... in two locations"
    refs:
      - "apps/api/src/services/review_session_service.py:357"
      - "apps/api/src/services/review_session_service.py:629"
    status: FIXED
    verified: true

  - id: BUG-4.9-003
    severity: High
    category: Reliability
    summary: "Quiz session creation failed with 500 error after completing review"
    description: "Starting a new adaptive quiz after completing a review session caused UniqueViolationError on idx_quiz_sessions_user_active_unique"
    root_cause: "Orphaned active sessions not being detected by get_active_session() due to race conditions or cache issues"
    fix: "Added force_end_active_sessions() method and try-catch with automatic recovery around session creation"
    refs:
      - "apps/api/src/services/quiz_session_service.py:125-160"
      - "apps/api/src/repositories/quiz_session_repository.py:271-306"
    status: FIXED
    verified: true

  - id: BUG-4.9-004
    severity: High
    category: Data Persistence
    summary: "Reading queue items not appearing after quiz answer submission"
    description: "Logs showed chunks_added=3 but items did not appear in reading library UI"
    root_cause: |
      Two issues:
      1. Raw SQL insert in add_to_queue() didn't include status field - Python model defaults don't apply to SQLAlchemy Core inserts
      2. Transaction commit timing - items were flushed but parent transaction commit happened on different session
    fix: |
      1. Added explicit status='unread' to insert values in add_to_queue()
      2. Added explicit await self.session.commit() in populate_reading_queue()
    refs:
      - "apps/api/src/repositories/reading_queue_repository.py:73"
      - "apps/api/src/services/reading_queue_service.py:173-177"
    status: FIXED
    verified: true

