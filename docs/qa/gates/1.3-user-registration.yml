top_issues:
  - severity: high
    status: resolved
    category: blocking
    title: 'Import path inconsistency prevented all tests from running'
    description: 'All source files and tests used absolute imports (apps.api.src.*) instead of relative imports (src.*), causing ModuleNotFoundError when running pytest from apps/api directory'
    impact: 'Complete test failure - 0/36 tests could execute'
    resolution: 'Fixed all import paths across 10 files (6 source + 3 test files + .env.example)'
    refs:
      - 'src/routes/auth.py:7-11'
      - 'src/utils/auth.py:8'
      - 'src/middleware/error_handler.py:10-16'
      - 'src/services/auth_service.py:8-12'
      - 'src/repositories/user_repository.py:10-11'
      - 'src/schemas/auth.py:7'
      - 'tests/unit/test_auth_utils.py:9-10'
      - 'tests/unit/test_auth_service.py:10-13'
      - 'tests/integration/test_auth_registration_api.py:9-10'
    suggested_owner: dev

  - severity: medium
    status: resolved
    category: deprecation
    title: 'Use of deprecated datetime.utcnow() in Python 3.12+'
    description: 'Multiple files used datetime.utcnow() which is deprecated in Python 3.12 in favor of datetime.now(timezone.utc)'
    impact: 'Deprecation warnings, potential future compatibility issues'
    resolution: 'Replaced 9 instances of datetime.utcnow() with datetime.now(timezone.utc) in utils/auth.py and middleware/error_handler.py'
    refs:
      - 'src/utils/auth.py:54-62'
      - 'src/middleware/error_handler.py:29,45,61,77,93,109'
    suggested_owner: dev

  - severity: low
    status: resolved
    category: code_quality
    title: 'Missing return type hint on register endpoint'
    description: 'FastAPI endpoint lacked explicit return type annotation'
    impact: 'Reduced type safety and IDE support'
    resolution: 'Added -> RegisterResponse type hint to register endpoint'
    refs:
      - 'src/routes/auth.py:26'
    suggested_owner: dev

